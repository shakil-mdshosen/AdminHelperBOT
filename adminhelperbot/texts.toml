# ============================================================================
#  AdminHelperBot — সব বাংলা লেখা এই একটি ফাইলে
# ============================================================================
#
#  বট পাতায় যা লেখে, সম্পাদনা সারাংশে যা লেখে, এবং পাতা পড়ার সময় যেসব বাংলা
#  শব্দ/টেমপ্লেট খোঁজে — সবকিছু এখানে। লেখা বদলাতে শুধু এই ফাইলটি সম্পাদনা
#  করে বট আবার চালু করুন; কোডে হাত দিতে হবে না।
#
#  নিয়ম:
#  * $নাম আকারের শব্দগুলো (যেমন $actors, $last_edit) বট নিজে বসায়। এগুলো
#    মুছবেন না বা বানান বদলাবেন না; চাইলে জায়গা বদলাতে পারেন।
#    প্রতিটি লেখার উপরে মন্তব্যে বলা আছে কোন $নাম ব্যবহার করা যায়।
#  * লেখায় আসল ডলার চিহ্ন লাগলে $$ লিখুন।
#  * উইকি টেমপ্লেট {{…}} যেমন আছে তেমনই লিখুন।
#  * ফাইলে কোনো ভুল থাকলে বট চালু হওয়ার সময়ই কোন লেখায় কী ভুল তা বলে দেয়।
#  * বিকল্প ফাইল ব্যবহার করতে config.json-এ "texts_file": "path/to/file.toml" দিন।
# ============================================================================


# ----------------------------------------------------------------------------
# উইকির নাম ও টেমপ্লেট
# ----------------------------------------------------------------------------
[wiki]
# যে একটি পাতায় বট কাজ করে
page_title = "উইকিপিডিয়া:প্রশাসকদের আলোচনাসভা"

# বট চালু হওয়ার সময় এই দুটি টেমপ্লেটের পুনর্নির্দেশগুলো উইকি থেকে শিখে নেয়,
# এবং {{subst:সহঅ}} কী হয় তা দেখে সংগ্রহশালার চিহ্ন শেখে।
done_template = "করা হয়েছে"
archive_template = "সহঅ"

# নামস্থান ও বিশেষ পাতার নাম (লিংক থেকে ব্যবহারকারীর নাম বের করতে)
user_namespaces = ["ব্যবহারকারী", "ব্যবহারকারীর", "user", "ব্যবহারকারিণী", "ব্যবহারকারিনী"]
user_talk_namespaces = ["ব্যবহারকারী আলাপ", "user talk", "ব্যবহারকারীর আলাপ"]
contributions_prefixes = [
    "বিশেষ:অবদান", "বিশেষ:ব্যবহারকারীর অবদান", "বিশেষ:অবদানসমূহ",
    "বিশেষ:contributions", "special:contributions", "special:contribs",
]
template_namespaces = ["টেমপ্লেট", "টেম্পলেট", "template"]

# জরুরি বন্ধের পাতায় (config-এর run_page) এর যেকোনোটি থাকলে বট চলবে
run_page_ok = ["চালু", "true", "on"]


# ----------------------------------------------------------------------------
# বট পাতায় যা লেখে
# ----------------------------------------------------------------------------
[page]
# সম্পন্ন চিহ্নিত করার লাইন।  $actors = যিনি/যাঁরা পদক্ষেপ নিয়েছেন (যেমন "ক ও খ")
done_line = "$actors কর্তৃক {{করা হয়েছে}} <small>(স্বয়ংক্রিয় বট বার্তা)</small> --~~~~"

# বাসি অনুরোধের লাইন।  $subject = নিচের stale_subject_one/many,
# $last_edit = শেষ সম্পাদনার সময় (নিচের [datetime] format অনুযায়ী)
# (বট এই অনুরোধকে পরে "সিদ্ধান্ত হয়েছে" হিসেবে চিনতে [detection]-এর
#  decision_phrases-এ এই লাইনের শুরুর অংশটি রাখা আছে; বদলালে সেখানেও বদলান।)
stale_line = "বাধা দেওয়ার প্রয়োজন নেই, $subject থেকে সর্বশেষ সম্পাদনা $last_edit টায় হয়েছে। <small>(স্বয়ংক্রিয় বট বার্তা)</small> --~~~~"
# অস্থায়ী অ্যাকাউন্ট থেকে কোনো সম্পাদনাই না থাকলে।  $subject
stale_line_no_edits = "বাধা দেওয়ার প্রয়োজন নেই, $subject থেকে কোনো সম্পাদনা হয়নি। <small>(স্বয়ংক্রিয় বট বার্তা)</small> --~~~~"
stale_subject_one = "অস্থায়ী অ্যাকাউন্ট"
stale_subject_many = "অস্থায়ী অ্যাকাউন্টগুলো"

# সম্পন্ন/বাসি লাইনের পরের লাইন (সংগ্রহশালাভুক্তির চিহ্ন)
archive_line = "{{subst:সহঅ}}"

# প্রশাসক আগেই {{করা হয়েছে}} / {{করা হয়নি}} দিয়েছেন কিন্তু সংগ্রহশালার
# চিহ্ন দেননি — তখন শুধু এটি যোগ হয়।
archive_only_line = "{{subst:সহঅ}}"

# একাধিক নাম জোড়া লাগানো: "ক", "ক ও খ", "ক, খ ও গ"
list_separator = ", "
list_last_separator = " ও "

# লগ লুকানো থাকায় নাম জানা না গেলে
unknown_admin = "প্রশাসক"
unknown_steward = "স্টুয়ার্ড"


# ----------------------------------------------------------------------------
# সম্পাদনা সারাংশ
# ----------------------------------------------------------------------------
# বট প্রতিটি সারাংশের শুরুতে নিজে "/* অনুচ্ছেদের শিরোনাম */ " যোগ করে।
# সারাংশ ৫০০ অক্ষরের বেশি হলে শুধু $details অংশ ছোট করা হয়।
[summary]
# $details = নিচের action_* লেখাগুলো, details_separator দিয়ে জোড়া
# $grace = অপেক্ষার মিনিট (বাংলা সংখ্যায়)
done = "বট: অনুরোধটি সম্পন্ন হিসেবে চিহ্নিত ও সংগ্রহশালাভুক্তির জন্য প্রস্তুত করা হলো — $details। পদক্ষেপ নেওয়ার $grace মিনিট পরেও কেউ চিহ্নিত না করায় স্বয়ংক্রিয়ভাবে {{করা হয়েছে}} ও {{সহঅ}} যোগ করা হয়েছে। (স্বয়ংক্রিয় সম্পাদনা)"
details_separator = "; "

# প্রতিটি অ্যাকাউন্টের পদক্ষেপের বিবরণ।
# $account = অ্যাকাউন্ট, $actor = প্রশাসক/স্টুয়ার্ড, $when = নিচের "when" (সময় জানা থাকলে)
action_local_block = "$account-কে প্রশাসক $actor স্থানীয়ভাবে বাধা দিয়েছেন$when"
action_local_partial_block = "$account-কে প্রশাসক $actor স্থানীয়ভাবে আংশিক বাধা দিয়েছেন$when"
action_global_lock = "$account অ্যাকাউন্টটি স্টুয়ার্ড $actor বৈশ্বিকভাবে লক করেছেন$when"
action_global_block = "$account-কে স্টুয়ার্ড $actor বৈশ্বিকভাবে বাধা দিয়েছেন$when"
# $time = পদক্ষেপের সময়
when = " ($time)"

# বাসি অনুরোধ।  $details = stale_details, $archive_note = stale_archive_note (বা খালি)
stale = "বট: অনুরোধটি অপ্রয়োজনীয় হিসেবে চিহ্নিত — $details$archive_note। (স্বয়ংক্রিয় সম্পাদনা)"
# $no_action_hours, $inactivity_hours = ঘণ্টা (বাংলা সংখ্যায়), $accounts = অ্যাকাউন্টগুলো,
# $last_edit_info = stale_last_edit_info বা stale_no_edit_info
stale_details = "রিপোর্ট করার $no_action_hours ঘণ্টার মধ্যে অস্থায়ী অ্যাকাউন্ট $accounts-এর বিরুদ্ধে কোনো প্রশাসক বা স্টুয়ার্ড পদক্ষেপ নেননি এবং গত $inactivity_hours ঘণ্টায় কোনো সম্পাদনা হয়নি ($last_edit_info)"
# $last_edit = শেষ সম্পাদনার সময়
stale_last_edit_info = "সর্বশেষ সম্পাদনা: $last_edit"
stale_no_edit_info = "অ্যাকাউন্টটি থেকে কোনো সম্পাদনা নেই"
stale_archive_note = "; সংগ্রহশালাভুক্তির জন্য {{সহঅ}} যোগ করা হয়েছে"

# শুধু সংগ্রহশালার চিহ্ন যোগ।
# $details = যে টেমপ্লেট দিয়ে আগে চিহ্নিত করা হয়েছিল (যেমন {{done}}), $grace = মিনিট
archive_only = "বট: অনুরোধটি আগেই $details দিয়ে চিহ্নিত করা হয়েছে, কিন্তু সংগ্রহশালাভুক্তির টেমপ্লেট যোগ করা হয়নি; শেষ মন্তব্যের $grace মিনিট পরেও কেউ যোগ না করায় স্বয়ংক্রিয়ভাবে {{সহঅ}} যোগ করা হলো। (স্বয়ংক্রিয় সম্পাদনা)"


# ----------------------------------------------------------------------------
# তারিখ ও সময়
# ----------------------------------------------------------------------------
[datetime]
# বট যেভাবে সময় লেখে।  $day $month $year $hour $minute $tz
# (সংখ্যাগুলো বট নিজে বাংলা অঙ্কে লেখে)
format = "$day $month $year, $hour:$minute ($tz)"
tz_label = "ইউটিসি"

# লেখার জন্য মাসের নাম (জানুয়ারি থেকে ডিসেম্বর, ক্রমানুসারে ১২টি)
months = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
          "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"]

# স্বাক্ষর পড়ার সময় উপরের নামগুলো ছাড়াও এই বানানগুলো বোঝা হয়।
# (ইংরেজি মাসের নাম কোডেই আছে।)
month_variants = { "জানুয়ারী" = 1, "ফেব্রুয়ারী" = 2, "আগষ্ট" = 8 }

# স্বাক্ষরের শেষে বন্ধনীর ভেতরের সময়-অঞ্চল
signature_tz_labels = ["ইউটিসি", "UTC", "ইউ.টি.সি"]


# ----------------------------------------------------------------------------
# পাতা পড়ার নিয়ম
# ----------------------------------------------------------------------------
[detection]
# প্রশাসকের সিদ্ধান্তের টেমপ্লেট: এগুলোর কোনোটি থাকলে কিন্তু সংগ্রহশালার চিহ্ন
# না থাকলে বট শুধু {{subst:সহঅ}} যোগ করে। ({{Doing}} এখানে নেই — কাজ চলছে।)
decision_templates = [
    "করা হয়েছে", "করা হয়নি", "সম্পন্ন", "সম্পন্ন হয়েছে", "হয়েছে",
    "done", "not done", "notdone", "already done", "alreadydone",
    "resolved", "সমাধান হয়েছে", "stale", "বাসি", "withdrawn", "প্রত্যাহার",
]
# সিদ্ধান্ত বোঝায় এমন লেখা (বটের নিজের বাসি-বার্তা)
decision_phrases = ["বাধা দেওয়ার প্রয়োজন নেই"]

# সংগ্রহশালার চিহ্ন: এগুলোর কোনোটি থাকলে অনুরোধটি সম্পূর্ণ বন্ধ, বট ছোঁয় না।
archive_templates = [
    "সহঅ", "সমাধান হওয়া অনুচ্ছেদ", "সমাধানকৃত", "resolved section",
    "archive top", "atop", "closed rfc top", "archive-top",
]

# যেসব টেমপ্লেটের প্রথম প্যারামিটার রিপোর্ট করা অ্যাকাউন্ট
report_templates = [
    "userlinks", "user", "user5", "user-multi", "vandal", "ipvandal",
    "userlinks-min", "user-uaa", "checkuser", "checkip", "iplinks", "ip",
    "ব্যবহারকারী", "ব্যবহারকারী সংযোগ", "ব্যবহারকারী লিংক", "ব্যবহারকারী লিঙ্ক",
    "ধ্বংসপ্রবণতা", "ধ্বংসপ্রবণ", "অস্থায়ী অ্যাকাউন্ট",
    "ta", "tempuser", "temp user", "temporary account",
]

# বাধাদানের অনুরোধ চেনার মূলশব্দ (শিরোনাম বা প্রথম মন্তব্যের দৃশ্যমান লেখায়,
# শব্দের শুরুতে থাকতে হবে: "বাধাদানের" গোনা হয়, "পুলক"-এর "লক" নয়)
block_keywords = [
    "বাধা", "ব্লক", "block", "লক", "lock", "ধ্বংসপ্রবণ", "ধ্বংসাত্মক",
    "ভ্যান্ডাল", "ভাণ্ডাল", "vandal", "স্প্যাম", "spam", "সকপাপেট",
    "sock", "অস্থায়ী অ্যাকাউন্ট", "অবরুদ্ধ", "নিষেধাজ্ঞা", "lta",
]

# "বাধাদানের অনুরোধ: Mr. Souraj ও Mr. Ranju Maity" ধাঁচের শিরোনাম থেকে নাম নেওয়া
# (regular expression; names নামের group-এ নামগুলো থাকে)
heading_account_regex = '^\s*(?:বাধা\s*(?:দান|প্রদান)(?:ের)?|ব্লক(?:ের)?|block)\s*(?:করার\s*)?(?:অনুরোধ|request)\s*[ঃ:：\-–—]\s*(?P<names>.+?)\s*$'
# নামগুলোর মাঝের বিভাজক
heading_name_separator_regex = '\s*(?:,|،|;|/|&|\s+ও\s+|\s+এবং\s+|\s+and\s+)\s*'

# {{subst:সহঅ}}-এর ফলাফলে থাকলেও এগুলোকে কখনো সংগ্রহশালার চিহ্ন ধরা হবে না
generic_templates = ["small", "u", "ping", "re", "reply to", "replyto", "উত্তর",
                     "বট", "bot", "tl", "nowrap", "font", "color"]


# ----------------------------------------------------------------------------
# কমান্ড লাইন
# ----------------------------------------------------------------------------
[cli]
description = "বাংলা উইকিপিডিয়ার প্রশাসকদের আলোচনাসভার সহায়ক বট"
